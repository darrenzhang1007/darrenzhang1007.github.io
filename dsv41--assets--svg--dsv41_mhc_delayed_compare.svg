<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img">
  <title>第 i 层残差接力三态对比：普通 Transformer vs 正常 mHC vs 延迟 mHC</title>
  <desc>从左到右依次对比：普通 Transformer（单流 r0→r1→r2）、正常状态下的 mHC（未延迟 residual0→residual1→residual2）、延迟状态下的 mHC（vLLM 实际执行，post 推迟半步与下一 pre 融合）。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="1240" height="760" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="620" y="34" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="bold" fill="#0f172a">
    第 i 层（Layer i）残差流接力对比：① 普通 Transformer（最左） vs  ② 正常 mHC（中间） vs  ③ 延迟 mHC（最右，vLLM 实际执行）
  </text>

  <!-- Horizontal alignment guide bands -->
  <rect x="20" y="178" width="1200" height="74" rx="4" fill="#f1f5f9" opacity="0.55"/>
  <rect x="20" y="342" width="1200" height="124" rx="4" fill="#f1f5f9" opacity="0.55"/>
  <rect x="20" y="546" width="1200" height="52" rx="4" fill="#f1f5f9" opacity="0.55"/>

  <!-- ==================== COLUMN 1 (LEFT): 普通 Transformer ==================== -->
  <g id="col-left">
    <rect x="30" y="52" width="350" height="36" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <text x="205" y="75" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">
      ① 普通 Transformer（单条残差流）
    </text>

    <rect x="55" y="100" width="300" height="46" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
    <text x="205" y="120" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="bold" fill="#334155">层入口输入（本层初始残差 r₀）</text>
    <text x="205" y="138" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" fill="#0f172a">r₀ [T, 5120]</text>
    <line x1="205" y1="146" x2="205" y2="182" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="35" y="160" width="340" height="454" rx="10" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7,4"/>
    <rect x="48" y="151" width="64" height="18" rx="4" fill="#f8fafc"/>
    <text x="80" y="164" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" font-weight="bold" fill="#475569">Layer i</text>

    <rect x="55" y="186" width="300" height="58" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="205" y="210" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" font-weight="bold" fill="#1e293b">1. 进 Attention 前</text>
    <text x="205" y="231" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" fill="#334155">x_in = RMSNorm(r₀)</text>
    <line x1="205" y1="244" x2="205" y2="274" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="55" y="278" width="300" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
    <text x="205" y="305" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="13" font-weight="bold" fill="#9a3412">2. x_attn = Attention(x_in)</text>
    <line x1="205" y1="322" x2="205" y2="348" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="55" y="352" width="300" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="205" y="379" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" fill="#1e293b">3. r₁ = r₀ + x_attn（出 Attn 后的残差）</text>
    <line x1="205" y1="396" x2="205" y2="412" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="55" y="416" width="300" height="44" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="205" y="443" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" fill="#1e293b">4. x_in = RMSNorm(r₁)</text>
    <line x1="205" y1="460" x2="205" y2="480" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="55" y="484" width="300" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
    <text x="205" y="511" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="13" font-weight="bold" fill="#991b1b">5. x_moe = MoE(x_in)</text>
    <line x1="205" y1="528" x2="205" y2="548" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="55" y="552" width="300" height="42" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
    <text x="205" y="578" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" fill="#1e293b">6. r₂ = r₁ + x_moe（在 r₁ 上累加）</text>
    <line x1="205" y1="594" x2="205" y2="636" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="55" y="640" width="300" height="58" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
    <text x="205" y="664" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">传给 Layer i+1（出 MoE 后的 r₂）：</text>
    <text x="205" y="685" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" fill="#334155">r₂ [T, 5120]  (= r₀ + x_attn + x_moe)</text>
  </g>

  <!-- ==================== COLUMN 2 (MIDDLE): 正常 mHC（未延迟） ==================== -->
  <g id="col-mid">
    <rect x="415" y="52" width="370" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="600" y="75" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">
      ② 正常 mHC（未延迟：每子层自闭环）
    </text>

    <rect x="435" y="100" width="330" height="46" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="600" y="120" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">层入口输入（本层初始 4 流残差）</text>
    <text x="600" y="138" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" fill="#1d4ed8">residual₀ [T, 4, 5120]</text>
    <line x1="600" y1="146" x2="600" y2="182" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="420" y="160" width="360" height="454" rx="10" fill="none" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="7,4"/>
    <rect x="433" y="151" width="64" height="18" rx="4" fill="#f8fafc"/>
    <text x="465" y="164" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" font-weight="bold" fill="#2563eb">Layer i</text>

    <rect x="435" y="186" width="330" height="58" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="600" y="209" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" font-weight="bold" fill="#1e3a8a">1. Attn pre（4 流压成 1 流）</text>
    <text x="600" y="230" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#1e40af">读 residual₀ → pre_mix 加权压成 x_in [T,5120] + Norm</text>
    <line x1="600" y1="244" x2="600" y2="274" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="435" y="278" width="330" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
    <text x="600" y="305" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="13" font-weight="bold" fill="#9a3412">2. x_attn = Attention(x_in)</text>
    <line x1="600" y1="322" x2="600" y2="348" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="435" y="352" width="330" height="42" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="600" y="378" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b">3. Attn post：x_attn 混入 residual₀ → 得 residual₁ 写回显存</text>

    <line x1="600" y1="394" x2="600" y2="414" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-warn)"/>
    <text x="608" y="408" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">▲ 痛点：刚把 residual₁ 写回显存，马上重读</text>

    <rect x="435" y="418" width="330" height="42" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="600" y="444" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b">4. MoE pre：再从显存读 residual₁ → 压成 x_in + Norm</text>
    <line x1="600" y1="460" x2="600" y2="480" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="435" y="484" width="330" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
    <text x="600" y="511" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="13" font-weight="bold" fill="#991b1b">5. x_moe = MoE(x_in)</text>
    <line x1="600" y1="528" x2="600" y2="548" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="435" y="552" width="330" height="42" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="600" y="578" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#1e3a8a">6. MoE post：x_moe 混入 residual₁ → 得 residual₂ 写回显存</text>
    <line x1="600" y1="594" x2="600" y2="636" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="435" y="640" width="330" height="58" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="600" y="664" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">传给 Layer i+1（出 MoE 后的 residual₂）：</text>
    <text x="600" y="685" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" fill="#1d4ed8">residual₂ [T, 4, 5120]</text>
  </g>

  <!-- ==================== COLUMN 3 (RIGHT): 延迟 mHC（vLLM 实际执行） ==================== -->
  <g id="col-right">
    <rect x="815" y="52" width="395" height="36" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="1.8"/>
    <text x="1012" y="75" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#14532d">
      ③ 延迟 mHC（vLLM 实际执行：post 推迟半步融合）
    </text>

    <rect x="830" y="100" width="365" height="46" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
    <text x="1012" y="119" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="bold" fill="#14532d">上一层传入未结清的 5 个张量：</text>
    <text x="1012" y="138" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="11.5" fill="#166534">(x_prev, residual₋₁, post_mix, res_mix, pre_mix)</text>
    <line x1="1012" y1="146" x2="1012" y2="182" stroke="#15803d" stroke-width="1.8" marker-end="url(#arrow-green)"/>

    <rect x="815" y="160" width="395" height="454" rx="10" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="7,4"/>
    <rect x="828" y="151" width="64" height="18" rx="4" fill="#f8fafc"/>
    <text x="860" y="164" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" font-weight="bold" fill="#15803d">Layer i</text>

    <rect x="830" y="186" width="365" height="58" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.8"/>
    <text x="1012" y="204" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" font-weight="bold" fill="#14532d">融合算子 ① mhc_shifted_post_pre (hc_attn_fn)</text>
    <text x="1012" y="221" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#166534">1) 先替上一层 MoE 做完 post → 算出本层初始 residual₀</text>
    <text x="1012" y="237" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#166534">2) 当场把 residual₀ 压成 x_in 与 attn_pre</text>
    <line x1="1012" y1="244" x2="1012" y2="274" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="830" y="278" width="365" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
    <text x="1012" y="305" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="13" font-weight="bold" fill="#9a3412">x_attn = Attention(x_in)</text>
    <line x1="1012" y1="322" x2="1012" y2="348" stroke="#15803d" stroke-width="1.8" marker-end="url(#arrow-green)"/>

    <rect x="830" y="352" width="365" height="108" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.8"/>
    <text x="1012" y="375" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="12" font-weight="bold" fill="#14532d">融合算子 ② mhc_shifted_post_pre (hc_ffn_fn)</text>
    <text x="1012" y="398" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#166534">1) 把 x_attn 混入 residual₀ → 更新出 4 流 residual₁</text>
    <text x="1012" y="419" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#166534">2) 当场用 attn_pre 把 residual₁ 压成 x_in 与 ffn_pre</text>
    <text x="1012" y="444" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" font-weight="bold" fill="#15803d">✓ residual₁ 在算子内直接消费，省掉一次 [T,4,5120] 显存往返</text>
    <line x1="1012" y1="460" x2="1012" y2="480" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="830" y="484" width="365" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
    <text x="1012" y="511" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="13" font-weight="bold" fill="#991b1b">x_moe = MoE(x_in)</text>
    <line x1="1012" y1="528" x2="1012" y2="548" stroke="#15803d" stroke-width="1.8" marker-end="url(#arrow-green)"/>

    <rect x="830" y="552" width="365" height="42" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="1012" y="578" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="bold" fill="#854d0e">本层末尾不做 post！（x_moe 暂不混入 residual₁）</text>
    <line x1="1012" y1="594" x2="1012" y2="636" stroke="#15803d" stroke-width="1.8" marker-end="url(#arrow-green)"/>

    <rect x="830" y="640" width="365" height="58" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="1012" y="663" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="bold" fill="#14532d">传给 Layer i+1 的六元组（留给下一层算 residual₂）：</text>
    <text x="1012" y="684" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="11.5" fill="#166534">(x_moe, residual₁, post_mix, res_mix, ffn_pre, previous_aux)</text>
  </g>

  <!-- Footer Note -->
  <text x="620" y="734" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#475569">
    注：首层（L0）入口没有上一层遗留的 post，单独调 mhc_pre；挂了 Engram 的层（L1、L14）入口先单独调 mhc_post_tilelang 结清上一层 post，注入 Engram 后再调 mhc_pre；末层（L39）结束后在 _collapse 里显式补一次 mhc_post_tilelang。
  </text>
</svg>
